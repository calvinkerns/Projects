<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Splat Viewer</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="icon" href="data:,">
</head>
<body>
    <canvas id="glcanvas"></canvas>
    <div id="controls">
        <button id="loadSpiralBtn">Load Spiral</button>
        <button id="loadGridBtn">Load Grid</button>
        <button id="loadDualGaussianBtn">Load Dual Gaussian</button>
        <input type="file" id="plyInput" accept=".ply" style="display: none">
        <button id="loadPlyBtn">Load PLY File</button>
        <input type="file" id="txtInput" accept=".txt" style="display: none">
        <button id="loadTxtBtn">Load TXT File</button>
        <button id="loadVanGoghBtn">Load Van Gogh Room</button>
        <button id="updateBtn">Manual Update</button>
        <button id="startAnimationBtn" class="animation-button-off">Toggle Updating: Off</button>
    </div>

    <div id="loadingOverlay" style="display: none">
        <div class="loading-content">
            <div class="loading-spinner"></div>
            <div id="loadingText">Loading...</div>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gl-matrix/3.4.2/gl-matrix-min.js"></script>
    <script type="module" src="js/app.js"></script>
</body>
</html>
